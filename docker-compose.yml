services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy_backend
    restart: always

    command: ["sh", "/var/www/docker/start.sh"]

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - app_secrets:/var/www/.runtime-secrets

    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CACHE_STORE=${CACHE_STORE:-failover}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-failover}
      - CACHE_PREFIX=${CACHE_PREFIX:-studybuddy-cache-}
      - CACHE_TTL=${CACHE_TTL:-300}
      - REDIS_CLIENT=${REDIS_CLIENT:-phpredis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/up > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy_queue
    restart: always
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5", "--sleep=3"]
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - app_secrets:/var/www/.runtime-secrets
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=${CACHE_STORE:-failover}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-failover}
      - CACHE_PREFIX=${CACHE_PREFIX:-studybuddy-cache-}
      - REDIS_CLIENT=${REDIS_CLIENT:-phpredis}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: studybuddy_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
       - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
       - NEXT_PUBLIC_BACKEND_ORIGIN=${NEXT_PUBLIC_BACKEND_ORIGIN:-http://localhost:8000}

    container_name: studybuddy_frontend
    restart: always

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
      - NEXT_PUBLIC_BACKEND_ORIGIN=${NEXT_PUBLIC_BACKEND_ORIGIN:-http://localhost:8000}

    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: studybuddy_db
    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  app_secrets: