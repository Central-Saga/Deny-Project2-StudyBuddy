version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=study_buddy_db
      - DB_USERNAME=studybuddy_user
      - DB_PASSWORD=secretpassword
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    container_name: studybuddy_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: studybuddy_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: studybuddy_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: study_buddy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy_user -d study_buddy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: